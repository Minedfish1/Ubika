# Headscale config — schema para headscale 0.26.x
# Ajuste server_url e derp.server.ipv4 para o IP/domínio público da VPS.

server_url: http://18.223.108.137:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090   # não publicado no compose (só dentro da rede docker)

grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v6: fd7a:115c:a1e0::/48
  v4: 100.64.0.0/10
  allocation: sequential

# DERP embutido: relay de fallback quando PC e celular não conseguem
# conexão direta (CGNAT de operadora móvel é o caso comum).
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "ubika"
    region_name: "Ubika VPS"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 18.223.108.137          # IP público da VPS (para STUN)
  urls: []                        # vazio = não usa os DERP públicos da Tailscale
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

policy:
  mode: file
  path: /etc/headscale/acl.hujson

dns:
  magic_dns: true
  base_domain: ubika.internal
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1

unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0770"

log:
  format: text
  level: info

logtail:
  enabled: false
